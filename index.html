<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div>Score: <span id="score-text">0</span></div>
            <div>Combo: x<span id="combo-text">0</span></div>
            <div>Wave: <span id="wave-text">1</span></div>
            <div>Lives: <span id="lives-text">❤️❤️❤️</span></div>
        </div>

        <div id="typing-area">Type here: <span id="current-input"></span></div>

        <div id="start-screen">
            <h1>Typing Battle</h1>
            <p>Type the words before they reach the bottom!</p>
            <button onclick="startGame()">Start Game</button>
        </div>

        <div id="game-over-screen">
            <h1 style="color: red;">GAME OVER</h1>
            <h2>Final Score: <span id="final-score">0</span></h2>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
